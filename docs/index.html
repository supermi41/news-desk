<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0b0d10">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="News Desk">
<title>DJ News Desk</title>
<!-- 개인 뉴스 클리핑 페이지. 검색엔진에 색인되지 않게 한다.
     언론사 RSS는 개인 구독 범위로 쓰고, 기사는 제목·요약 일부만 인용하며 원문으로 링크한다. -->
<meta name="robots" content="noindex, nofollow, noarchive">
<link rel="stylesheet" href="style.css?v=4">
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>📰</text></svg>">
</head>
<body>

<header class="topbar">
  <div class="topbar-row">
    <h1 class="brand">News&nbsp;Desk</h1>
    <div class="topbar-actions">
      <button id="btn-archive" class="icon-btn"
              data-tip="지난 날짜에 수집된 기사 보기"><span class="ico">🗓</span>지난 수집</button>
      <button id="btn-refresh" class="icon-btn"
              data-tip="서버에 올라온 최신 수집분을 다시 불러옵니다. 수집 자체는 매일 07:00·19:00에 자동으로 돕니다"><span class="ico">↻</span>새로고침</button>
    </div>
  </div>
  <div id="meta-line" class="meta-line">불러오는 중…</div>

  <div id="archive-bar" class="search-bar" hidden>
    <select id="archive-select"></select>
    <button id="archive-latest" class="text-btn">최신으로</button>
  </div>

  <div id="search-bar" class="search-bar">
    <input id="search-input" type="search" placeholder="🔍 키워드로 걸러보기 (예: 반도체, 프랜차이즈, 인수)" autocomplete="off">
    <button id="search-clear" class="text-btn" hidden>지우기</button>
  </div>

  <div class="tabs-wrap"><nav id="tabs" class="tabs"></nav></div>
</header>

<main id="view"></main>

<footer class="foot">
  <span id="foot-note"></span>
</footer>

<script src="app.js?v=4"></script>
</body>
</html>
