<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0b0d10">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="News Desk">
<title>DJ News Desk</title>
<link rel="stylesheet" href="style.css">
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>📰</text></svg>">
</head>
<body>

<header class="topbar">
  <div class="topbar-row">
    <h1 class="brand">News&nbsp;Desk</h1>
    <div class="topbar-actions">
      <button id="btn-search" class="icon-btn" aria-label="검색">🔍</button>
      <button id="btn-archive" class="icon-btn" aria-label="지난 날짜">🗓</button>
      <button id="btn-refresh" class="icon-btn" aria-label="새로고침">↻</button>
    </div>
  </div>
  <div id="meta-line" class="meta-line">불러오는 중…</div>

  <div id="search-bar" class="search-bar" hidden>
    <input id="search-input" type="search" placeholder="키워드로 걸러보기 (예: 젠테, MBK, 프랜차이즈)" autocomplete="off">
    <button id="search-clear" class="text-btn">지우기</button>
  </div>

  <div id="archive-bar" class="search-bar" hidden>
    <select id="archive-select"></select>
    <button id="archive-latest" class="text-btn">최신으로</button>
  </div>

  <nav id="tabs" class="tabs"></nav>
</header>

<main id="view"></main>

<footer class="foot">
  <span id="foot-note"></span>
</footer>

<script src="app.js"></script>
</body>
</html>
