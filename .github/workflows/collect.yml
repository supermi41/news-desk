name: 뉴스 수집

on:
  schedule:
    - cron: '0 22 * * *'   # 22:00 UTC = 07:00 KST (아침)
    - cron: '0 10 * * *'   # 10:00 UTC = 19:00 KST (저녁)
  workflow_dispatch:        # Actions 탭에서 수동 실행 가능

permissions:
  contents: write

concurrency:
  group: collect
  cancel-in-progress: false

jobs:
  collect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: 뉴스 수집
        env:
          # DART 인증키. M&A 탭 딜 테이블의 투자금액·지분율을 공시에서 정확히 가져온다.
          # 없으면 딜 테이블은 뉴스에서 뽑은 값만으로 채워진다.
          DART_API_KEY: ${{ secrets.DART_API_KEY }}
          # 있으면 외신 요약까지 번역한다 (MyMemory 한도 5,000 → 50,000단어)
          TRANSLATE_EMAIL: ${{ secrets.TRANSLATE_EMAIL }}
          # 네이버 검색 API는 유료 이관되어 현재 미사용. 키가 등록되면 자동으로 붙는다.
          NAVER_CLIENT_ID: ${{ secrets.NAVER_CLIENT_ID }}
          NAVER_CLIENT_SECRET: ${{ secrets.NAVER_CLIENT_SECRET }}
        run: python collect.py

      - name: 결과 커밋
        run: |
          git config user.name  "news-desk-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/data
          if git diff --staged --quiet; then
            echo "변경 없음 - 커밋 생략"
          else
            git commit -m "news: $(TZ=Asia/Seoul date +'%Y-%m-%d %H:%M KST')"
            git push
          fi
